name: Website
on:
  pull_request:
    branches: [main]
    paths:
      - packages/website/**
      - docs/**
      - README.md
      - .github/workflows/website.yml
      - packages/toolgate/src/adapters/**
  push:
    branches: [main]
    paths:
      - packages/website/**
      - docs/**
      - README.md
      - .github/workflows/website.yml
      - packages/toolgate/src/adapters/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # `pages: read` is for configure-pages (it reads the site's base path); nothing here can write to Pages.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The latest 22.x: the site needs 22.20 or later (rollup's binary), the rest of the repo needs 20.6.
          node-version: 22
      # Only these two workspaces: the site's generator reads the adapters of packages/toolgate, which need their dependencies.
      # `CI` is set, so the postinstall skips the local setup.
      - run: npm ci --workspace packages/website --workspace packages/toolgate
      # Temporary: Pages is not on until the owner turns it on, and the build must pass without it, so this step may fail and the
      # base path then stays the one in site.config.json. Remove `continue-on-error` once Pages is on.
      - id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # A dead link fails this step, on a pull request too.
      - run: npm run -s docs:build --workspace packages/website
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/website/.vitepress/dist
  deploy:
    needs: build
    # Only the main branch deploys: a manual run from another branch builds but does not publish.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
